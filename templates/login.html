<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSync Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #f6f8fd 0%, #f1f6fd 100%); font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-screen flex items-center justify-center">
    <div class="bg-white p-10 rounded-2xl shadow-xl w-96 max-w-[90%] border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 tracking-tight">EduSync</h1>
            <p class="text-sm text-gray-500 mt-2">Sign in to your account</p>
        </div>
        
        {% if error %}
        <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-100">
            {{ error }}
        </div>
        {% endif %}
        
        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="username" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="e.g. admin, teacher, student" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="e.g. admin123" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-lg shadow-blue-200">
                Sign In
            </button>
        </form>
        
        <div class="mt-6 text-xs text-gray-400 text-center">
            Demo Users: admin/admin123, teacher/teacher123, student/student123
        </div>
    </div>
</body>
</html>
